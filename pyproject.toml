[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmcp-forge"
version = "1.0.3"
description = "Enterprise Model Context Protocol (MCP) Server Boilerplate & CLI Generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "fastmcp", "boilerplate", "scaffolding", "claude", "cursor", "ai-agent"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fastmcp-forge = "fastmcp_forge.cli:main"

[tool.setuptools.packages.find]
include = ["fastmcp_forge*"]

[project.urls]
Funding = "https://github.com/sponsors/johannschiffer"
Homepage = "https://johannschiffer.github.io"
Repository = "https://github.com/johannschiffer/fastmcp-forge"
"Starter Kit" = "https://johanld.gumroad.com/l/genesis-starter-kit"
"Enterprise Suite" = "https://johanld.gumroad.com/l/genesis-enterprise-suite"
