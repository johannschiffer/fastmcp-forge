[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmcp-forge"
version = "2.0.1"
description = "FastMCP server framework, CLI project scaffolder, and stdio/SSE transport middleware"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "fastmcp", "boilerplate", "scaffolding", "claude", "cursor", "ai-agent"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fastmcp-forge = "fastmcp_forge.cli:main"

[tool.setuptools.packages.find]
include = ["fastmcp_forge*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/johannschiffer/fastmcp-forge"
Documentation = "https://github.com/johannschiffer/fastmcp-forge#readme"
Repository = "https://github.com/johannschiffer/fastmcp-forge"
Issues = "https://github.com/johannschiffer/fastmcp-forge/issues"
Funding = "https://ko-fi.com/johannschiffer"
