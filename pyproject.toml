[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmcp-forge"
version = "2.0.0"
description = "Production-grade FastMCP server scaffolder and test harness with stdio and SSE transport support"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "fastmcp", "boilerplate", "scaffolding", "claude", "cursor", "ai-agent"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fastmcp-forge = "fastmcp_forge.cli:main"

[tool.setuptools.packages.find]
include = ["fastmcp_forge*"]

[project.urls]
Homepage = "https://johannschiffer.github.io"
Documentation = "https://johannschiffer.github.io"
Repository = "https://github.com/johannschiffer/fastmcp-forge"
Issues = "https://github.com/johannschiffer/fastmcp-forge/issues"
Funding = "https://ko-fi.com/johannschiffer"
